org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 built-in Kotlin: allow Kotlin source sets
android.disallowKotlinSourceSets=false
# app sets testBuildType = "benchmark" so its androidTest microbenchmarks run on a
# non-debuggable build. AGP 9 would then only create unit-test tasks for that build
# type; keep JVM unit tests on debug (testDebugUnitTest) as before.
android.onlyEnableUnitTestForTheTestedBuildType=false
