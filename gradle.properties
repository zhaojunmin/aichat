org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 built-in Kotlin: allow Kotlin source sets
android.disallowKotlinSourceSets=false
# app sets testBuildType = "benchmark" so its androidTest microbenchmarks run on a
# non-debuggable build. AGP 9 would then only create unit-test tasks for that build
# type; keep JVM unit tests on debug (testDebugUnitTest) as before.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Run Android Lint from AGP 9.5 while building with AGP 9.0: compose-lints (lintChecks in
# app/build.gradle.kts) is built against the newer Kotlin analysis API, and AGP 9.0's lint
# skips it as "references invalid APIs". Drop this once AGP itself is 9.5+.
android.experimental.lint.version=9.5.0
