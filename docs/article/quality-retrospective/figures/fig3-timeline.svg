<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1320" viewBox="0 0 1080 1320"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="1320" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">过程:先补安全网,再按属性逐个击破</text><text x="48" y="106" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">21 个 PR,每个都可单独回滚;分支一律以 main 为 base</text><line x1="123" y1="170" x2="123" y2="1240" stroke="#D7DEE8" stroke-width="4"/><rect x="48" y="140" width="150" height="34" rx="17" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/><text x="123" y="164" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">P0 安全网与隐私</text><circle cx="123" cy="197" r="8" fill="#1F3A5F" stroke="none"/><text x="160" y="204" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">#14</text><text x="260" y="204" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">单元测试 + Lint baseline + CI</text><circle cx="123" cy="239" r="8" fill="#1F3A5F" stroke="none"/><text x="160" y="246" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">#15</text><text x="260" y="246" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">修复:本地模式记忆学习被云端 Key 卡死</text><circle cx="123" cy="281" r="8" fill="#1F3A5F" stroke="none"/><text x="160" y="288" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">#16</text><text x="260" y="288" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">关闭备份;调试节点树按需;解析移出主线程</text><circle cx="123" cy="323" r="8" fill="#1F3A5F" stroke="none"/><text x="160" y="330" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">#18</text><text x="260" y="330" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">API Key 改用 Keystore 加密,旧明文迁移</text><rect x="48" y="386" width="150" height="34" rx="17" fill="#E76F51" stroke="#E76F51" stroke-width="0"/><text x="123" y="410" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">可靠性</text><circle cx="123" cy="443" r="8" fill="#E76F51" stroke="none"/><text x="160" y="450" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="start">#19</text><text x="260" y="450" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">云端错误分类、可取消、30 秒时限;本地推理时限</text><circle cx="123" cy="485" r="8" fill="#E76F51" stroke="none"/><text x="160" y="492" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="start">#20</text><text x="260" y="492" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">可靠性单测;修复空串、"[]" 显示成候选</text><rect x="48" y="548" width="150" height="34" rx="17" fill="#B45309" stroke="#B45309" stroke-width="0"/><text x="123" y="572" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">性能</text><circle cx="123" cy="605" r="8" fill="#B45309" stroke="none"/><text x="160" y="612" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#B45309" text-anchor="start">#21-22</text><text x="260" y="612" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">真机微基准 + 宏基准;更正基准查询长度</text><circle cx="123" cy="647" r="8" fill="#B45309" stroke="none"/><text x="160" y="654" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#B45309" text-anchor="start">#23</text><text x="260" y="654" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">聊天解析改为点击时按需进行</text><circle cx="123" cy="689" r="8" fill="#B45309" stroke="none"/><text x="160" y="696" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#B45309" text-anchor="start">#24</text><text x="260" y="696" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">端到端 Trace;跳过前台 App 自身滚动事件</text><circle cx="123" cy="731" r="8" fill="#B45309" stroke="none"/><text x="160" y="738" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#B45309" text-anchor="start">#25</text><text x="260" y="738" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">点击路径主线程开销挪走;本地学习不抢锁</text><rect x="48" y="794" width="150" height="34" rx="17" fill="#8E7CC3" stroke="#8E7CC3" stroke-width="0"/><text x="123" y="818" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">正确性(真机发现)</text><circle cx="123" cy="851" r="8" fill="#8E7CC3" stroke="none"/><text x="160" y="858" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#8E7CC3" text-anchor="start">#26</text><text x="260" y="858" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">微信截图识别把一个气泡拆成几条</text><circle cx="123" cy="893" r="8" fill="#8E7CC3" stroke="none"/><text x="160" y="900" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#8E7CC3" text-anchor="start">#27</text><text x="260" y="900" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">群聊发言人名字被当成对方消息</text><rect x="48" y="956" width="150" height="34" rx="17" fill="#E76F51" stroke="#E76F51" stroke-width="0"/><text x="123" y="980" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">可靠性(续)</text><circle cx="123" cy="1013" r="8" fill="#E76F51" stroke="none"/><text x="160" y="1020" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="start">#28</text><text x="260" y="1020" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">学习进度与写记忆同一事务;迁移测试</text><circle cx="123" cy="1055" r="8" fill="#E76F51" stroke="none"/><text x="160" y="1062" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="start">#29</text><text x="260" y="1062" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">真机可靠性黑盒 6 个场景</text><rect x="48" y="1118" width="150" height="34" rx="17" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/><text x="123" y="1142" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">可观测性</text><circle cx="123" cy="1175" r="8" fill="#2A9D8F" stroke="none"/><text x="160" y="1182" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="start">#30</text><text x="260" y="1182" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">设计文档(评审后定稿)</text><circle cx="123" cy="1217" r="8" fill="#2A9D8F" stroke="none"/><text x="160" y="1224" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="start">#31-34</text><text x="260" y="1224" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start">错误码、诊断开关、接入 28 处、导出、耗时分布</text><text x="1032" y="1296" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 3 · 过程时间线</text></svg>