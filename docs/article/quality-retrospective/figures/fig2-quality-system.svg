<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="860" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">五层安全网</text><text x="48" y="106" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">从「0 测试、0 CI」到五层安全网 + 守门约定</text><path d="M228,140 L492,140 L510,248 L210,248 Z" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="2"/><text x="360" y="188" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#1F3A5F" text-anchor="middle">线上:本地诊断信息</text><text x="360" y="216" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">错误码 · 进程退出原因</text><text x="360" y="238" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">耗时分布 · 用户主动导出</text><path d="M186,260 L534,260 L552,368 L168,368 Z" fill="#FDECE7" stroke="#E76F51" stroke-width="2"/><text x="360" y="308" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#E76F51" text-anchor="middle">真机黑盒:可靠性</text><text x="360" y="336" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">quality/reliability</text><text x="360" y="358" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">崩溃 / 内存压力 / 收权限 / 断网 / 配置变化</text><path d="M144,380 L576,380 L594,488 L126,488 Z" fill="#FEF3E6" stroke="#B45309" stroke-width="2"/><text x="360" y="428" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#B45309" text-anchor="middle">真机:端到端 Trace</text><text x="360" y="456" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">trace-e2e.sh · 读屏事件、点击到出结果的分段耗时</text><path d="M102,500 L618,500 L636,608 L84,608 Z" fill="#EFEBF8" stroke="#8E7CC3" stroke-width="2"/><text x="360" y="548" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#8E7CC3" text-anchor="middle">真机:微基准 / 宏基准</text><text x="360" y="576" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">向量、召回、解析的耗时与分配;冷热启动、滚动帧</text><path d="M60,620 L660,620 L678,728 L42,728 Z" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2"/><text x="360" y="668" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#2A9D8F" text-anchor="middle">JVM:单元测试 + Robolectric</text><text x="360" y="696" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">165 个 · 每次提交都跑 · 含隐私哨兵、事务回滚、迁移</text><text x="360" y="766" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="middle">越往上越接近真实使用,越往下越快、越便宜</text><rect x="720" y="140" width="312" height="590" rx="14" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="744" y="184" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F3A5F" text-anchor="start">守门与约定</text><circle cx="754" cy="228" r="9" fill="#2A9D8F" stroke="none"/><text x="774" y="235" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">GitHub Actions CI</text><text x="774" y="265" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">每个 PR:单测 + Lint + 编译</text><circle cx="754" cy="312" r="9" fill="#2A9D8F" stroke="none"/><text x="774" y="319" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Lint baseline</text><text x="774" y="349" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">接纳存量,只约束不新增</text><circle cx="754" cy="396" r="9" fill="#2A9D8F" stroke="none"/><text x="774" y="403" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">本地先过一遍</text><text x="774" y="433" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">test + lint + assemble 通过才开 PR</text><circle cx="754" cy="480" r="9" fill="#2A9D8F" stroke="none"/><text x="774" y="487" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">真机用 release 包</text><text x="774" y="517" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">R8 混淆后的才是用户跑的</text><circle cx="754" cy="564" r="9" fill="#2A9D8F" stroke="none"/><text x="774" y="571" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">热路径改动附数据</text><text x="774" y="601" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">用 Trace 证明没有变慢</text><circle cx="754" cy="648" r="9" fill="#2A9D8F" stroke="none"/><text x="774" y="655" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">隐私不靠自觉</text><text x="774" y="685" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">接口不收文本 + 哨兵测试</text><text x="1032" y="836" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 2 · 工程质量体系</text></svg>