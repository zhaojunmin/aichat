<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="872" viewBox="0 0 1080 872"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="872" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">先排优先级:七个质量属性</text><text x="48" y="132" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">H/M/L = 业务重要性 / 实现难度;越靠上越优先,冲突时上面的说了算</text><rect x="48" y="160" width="984" height="82" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="160" width="8" height="82" rx="3" fill="#E76F51" stroke="#E76F51" stroke-width="0"/><circle cx="92" cy="201.0" r="18" fill="#E76F51" stroke="none"/><text x="92" y="208.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124" y="200" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start">隐私与安全</text><rect x="124" y="210" width="43.52" height="22" rx="11" fill="#E76F51" stroke="#E76F51" stroke-width="1"/><text x="145.76" y="224.96" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">H/H</text><rect x="330" y="172" width="300" height="10" rx="5" fill="#E76F51" stroke="#E76F51" stroke-width="0"/><text x="330" y="208" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">读的是私聊内容,还握着无障碍、悬浮窗、截屏三项高敏权限</text><text x="330" y="234" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">目标:本地模式聊天内容 0 字节出设备;Key 不以明文存在;不进云备份</text><rect x="48" y="256" width="984" height="82" rx="12" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="256" width="8" height="82" rx="3" fill="#F4A261" stroke="#F4A261" stroke-width="0"/><circle cx="92" cy="297.0" r="18" fill="#F4A261" stroke="none"/><text x="92" y="304.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="124" y="296" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start">可靠性 / 正确性</text><rect x="124" y="306" width="43.52" height="22" rx="11" fill="#F4A261" stroke="#F4A261" stroke-width="1"/><text x="145.76" y="320.96" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">H/H</text><rect x="330" y="268" width="274" height="10" rx="5" fill="#F4A261" stroke="#F4A261" stroke-width="0"/><text x="330" y="304" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">「我 / 对方」分错就答非所问;服务一崩会被系统禁用</text><text x="330" y="330" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">目标:回调异常不崩溃;失败给出可读错误;学习失败不丢、不重复</text><rect x="48" y="352" width="984" height="82" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="352" width="8" height="82" rx="3" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/><circle cx="92" cy="393.0" r="18" fill="#2A9D8F" stroke="none"/><text x="92" y="400.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="124" y="392" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start">性能</text><rect x="124" y="402" width="43.52" height="22" rx="11" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="1"/><text x="145.76" y="416.96" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">H/M</text><rect x="330" y="364" width="248" height="10" rx="5" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/><text x="330" y="400" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">用户在聊天中途等结果,超过 3 秒就自己打字了</text><text x="330" y="426" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">目标:点击到出结果 P50 ≤ 2.5s、P95 ≤ 5s;单个事件主线程 ≤ 8ms</text><rect x="48" y="448" width="984" height="82" rx="12" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="448" width="8" height="82" rx="3" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/><circle cx="92" cy="489.0" r="18" fill="#1F3A5F" stroke="none"/><text x="92" y="496.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="124" y="488" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start">可维护 / 可测试</text><rect x="124" y="498" width="43.52" height="22" rx="11" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="145.76" y="512.96" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">M/H</text><rect x="330" y="460" width="222" height="10" rx="5" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/><text x="330" y="496" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">解析规则、prompt、记忆策略会频繁调整</text><text x="330" y="522" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">目标:纯逻辑能在 JVM 上测;改动有回归测试兜底</text><rect x="48" y="544" width="984" height="82" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="544" width="8" height="82" rx="3" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/><circle cx="92" cy="585.0" r="18" fill="#1F3A5F" stroke="none"/><text x="92" y="592.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="124" y="584" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start">兼容 / 可适配</text><rect x="124" y="594" width="43.52" height="22" rx="11" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="145.76" y="608.96" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">M/H</text><rect x="330" y="556" width="196" height="10" rx="5" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/><text x="330" y="592" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">第三方 App 改版会让控件 id 失效(QQ 的 id 还是混淆过的)</text><text x="330" y="618" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">目标:规则失效时自动降级,不崩溃</text><rect x="48" y="640" width="984" height="82" rx="12" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="640" width="8" height="82" rx="3" fill="#6B7280" stroke="#6B7280" stroke-width="0"/><circle cx="92" cy="681.0" r="18" fill="#6B7280" stroke="none"/><text x="92" y="688.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="124" y="680" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start">易用性</text><rect x="124" y="690" width="43.52" height="22" rx="11" fill="#6B7280" stroke="#6B7280" stroke-width="1"/><text x="145.76" y="704.96" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">M/M</text><rect x="330" y="652" width="170" height="10" rx="5" fill="#6B7280" stroke="#6B7280" stroke-width="0"/><text x="330" y="688" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">权限引导、失败提示、填入失败的回退</text><text x="330" y="714" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">目标:每个失败都给出可操作的下一步</text><rect x="48" y="736" width="984" height="82" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="736" width="8" height="82" rx="3" fill="#6B7280" stroke="#6B7280" stroke-width="0"/><circle cx="92" cy="777.0" r="18" fill="#6B7280" stroke="none"/><text x="92" y="784.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="124" y="776" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start">可观测性</text><rect x="124" y="786" width="43.52" height="22" rx="11" fill="#6B7280" stroke="#6B7280" stroke-width="1"/><text x="145.76" y="800.96" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">M/L</text><rect x="330" y="748" width="144" height="10" rx="5" fill="#6B7280" stroke="#6B7280" stroke-width="0"/><text x="330" y="784" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">出了问题只能连 adb 复现,用户侧完全不可见</text><text x="330" y="810" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">目标:错误码 + 本地诊断 + 用户主动导出</text><text x="1032" y="848" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 1 · 质量属性效用树</text></svg>