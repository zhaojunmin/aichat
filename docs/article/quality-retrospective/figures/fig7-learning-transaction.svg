<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="760" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">可靠性:把「两步」变成「一步」</text><text x="48" y="106" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">学习一轮要做两件事:写记忆、推进「已学到第几条」。两步不在一个事务里会怎样?</text><text x="48" y="150" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#E76F51" text-anchor="start">修复前</text><rect x="48" y="170" width="300" height="80" rx="12" fill="#FEF3E6" stroke="#F4A261" stroke-width="2"/><text x="198" y="220" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F2937" text-anchor="middle">写记忆(Room)</text><line x1="348" y1="210" x2="430" y2="210" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="389" cy="210" r="17" fill="#FFFFFF" stroke="none"/><line x1="380.6" y1="201.6" x2="397.4" y2="218.4" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><line x1="380.6" y1="218.4" x2="397.4" y2="201.6" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><text x="389" y="170" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#E76F51" text-anchor="middle">进程被杀</text><rect x="430" y="170" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="8,6"/><text x="595" y="206" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#6B7280" text-anchor="middle">推进进度(prefs)</text><text x="595" y="234" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">apply() 异步,可能没落盘</text><line x1="760" y1="210" x2="840" y2="210" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><rect x="840" y="170" width="192" height="80" rx="12" fill="#FDECE7" stroke="#E76F51" stroke-width="2"/><text x="936" y="206" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#E76F51" text-anchor="middle">重启后</text><text x="936" y="234" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#E76F51" text-anchor="middle">同一批再学一遍</text><text x="48" y="290" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">进程恰好在两步之间被杀:记忆已写入,进度却没前进 → 重试时重复学习,记忆里出现重复条目</text><text x="48" y="360" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#2A9D8F" text-anchor="start">修复后(#28)</text><rect x="48" y="380" width="984" height="120" rx="14" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2"/><text x="72" y="414" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="start">BEGIN TRANSACTION</text><rect x="72" y="428" width="214" height="54" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="1.5"/><text x="179" y="462" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">更新冲突记忆</text><line x1="286" y1="455" x2="306" y2="455" stroke="#2A9D8F" stroke-width="2" marker-end="url(#arrT)"/><rect x="308" y="428" width="214" height="54" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="1.5"/><text x="415" y="462" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">软删除过时记忆</text><line x1="522" y1="455" x2="542" y2="455" stroke="#2A9D8F" stroke-width="2" marker-end="url(#arrT)"/><rect x="544" y="428" width="214" height="54" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="1.5"/><text x="651" y="462" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">插入新记忆</text><line x1="758" y1="455" x2="778" y2="455" stroke="#2A9D8F" stroke-width="2" marker-end="url(#arrT)"/><rect x="780" y="428" width="214" height="54" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="1.5"/><text x="887" y="462" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">进度 → learning_state</text><text x="1008" y="414" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="end">COMMIT</text><text x="48" y="536" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">任何一步失败或进程被杀 → 整体回滚;下次重试只学一次。旧版本 prefs 里的进度首次读取时迁入数据库。</text><rect x="48" y="580" width="984" height="150" rx="14" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="72" y="620" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">怎么证明它真的对</text><text x="72" y="654" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· Robolectric + 真实 Room:写到一半失败、写完但存进度失败,都断言「一切如初」</text><text x="72" y="680" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 迁移测试:按 v1–v4 的建表语句造库,经真实迁移链打开,数据不丢</text><text x="72" y="706" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 变异检查:故意删掉 v5 表的主键,4 个迁移用例全部失败 —— 测试能抓到错</text><text x="1032" y="736" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 7 · 学习事务</text></svg>