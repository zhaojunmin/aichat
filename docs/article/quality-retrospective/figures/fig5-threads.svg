<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="920" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">性能:先看清代码跑在哪个线程上</text><text x="48" y="106" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">一次「点悬浮球」在各线程上的工作(优化前),红色编号是复盘时找到的问题</text><rect x="48" y="140" width="984" height="92" rx="10" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="64" y="180" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">聊天 App 主线程</text><text x="64" y="208" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">(另一个进程)</text><rect x="48" y="244" width="984" height="92" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="64" y="284" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">本 App 主线程</text><text x="64" y="312" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">悬浮窗 · 无障碍回调 · 界面</text><rect x="48" y="348" width="984" height="92" rx="10" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="64" y="388" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">IO 线程</text><text x="64" y="416" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">网络 · 数据库</text><rect x="48" y="452" width="984" height="92" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="64" y="492" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Default 线程</text><text x="64" y="520" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">OCR 后处理</text><rect x="48" y="556" width="984" height="92" rx="10" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="64" y="596" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">local-llm</text><text x="64" y="624" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">端侧推理(单线程 + 锁)</text><rect x="250" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="296" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="342" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="388" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="434" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="480" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="526" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="572" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><rect x="618" y="170" width="30" height="32" rx="4" fill="#FDECE7" stroke="#E76F51" stroke-width="1"/><text x="674" y="190" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#E76F51" text-anchor="start">每个无障碍事件都遍历整棵树:</text><text x="674" y="214" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#E76F51" text-anchor="start">每个节点一次跨进程查询,由对方主线程应答</text><circle cx="228" cy="186" r="17" fill="#E76F51" stroke="none"/><text x="228" y="192.84" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">④</text><rect x="250" y="262" width="70" height="56" rx="8" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="1.5"/><text x="285.0" y="295.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">点击</text><rect x="334" y="262" width="250" height="56" rx="8" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="459.0" y="295.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#E76F51" text-anchor="middle">整树定位 + 13MB 位图拷贝</text><circle cx="580" cy="262" r="17" fill="#E76F51" stroke="none"/><text x="580" y="268.84" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">③</text><rect x="720" y="262" width="190" height="56" rx="8" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="815.0" y="295.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#E76F51" text-anchor="middle">memoryBlock 91ms</text><circle cx="906" cy="262" r="17" fill="#E76F51" stroke="none"/><text x="906" y="268.84" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">②</text><rect x="922" y="262" width="92" height="56" rx="8" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="1.5"/><text x="968.0" y="295.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#2A9D8F" text-anchor="middle">显示结果</text><rect x="590" y="366" width="120" height="56" rx="8" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="1.5"/><text x="650.0" y="399.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">写回复日志</text><rect x="590" y="470" width="120" height="56" rx="8" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="1.5"/><text x="650.0" y="503.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">OCR 后处理</text><rect x="720" y="574" width="210" height="56" rx="8" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="825.0" y="607.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#E76F51" text-anchor="middle">后台学习先拿到锁</text><circle cx="926" cy="574" r="17" fill="#E76F51" stroke="none"/><text x="926" y="580.84" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">①</text><rect x="940" y="574" width="82" height="56" rx="8" fill="#FEF3E6" stroke="#B45309" stroke-width="1.5"/><text x="981.0" y="607.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">本地生成</text><line x1="712" y1="398" x2="790" y2="572" stroke="#E76F51" stroke-width="2" marker-end="url(#arrR)" stroke-dasharray="6,5"/><text x="770" y="504" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#E76F51" text-anchor="start">触发学习</text><rect x="48" y="680" width="984" height="210" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><circle cx="80" cy="716" r="15" fill="#E76F51" stroke="none"/><text x="80" y="721.76" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">①</text><text x="108" y="723" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">本地模式下,学习和生成抢唯一的推理锁 → 改为离开聊天 App 时才学习(#25)</text><circle cx="80" cy="762" r="15" fill="#E76F51" stroke="none"/><text x="80" y="767.76" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">②</text><text x="108" y="769" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">语义记忆的查询向量在主线程算(实测 91ms)→ 移到 Default 线程(#25)</text><circle cx="80" cy="808" r="15" fill="#E76F51" stroke="none"/><text x="80" y="813.76" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">③</text><text x="108" y="815" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">OCR:整树定位、整屏位图拷贝都在主线程 → IO / 后台 executor(#25)</text><circle cx="80" cy="854" r="15" fill="#E76F51" stroke="none"/><text x="80" y="859.76" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">④</text><text x="108" y="861" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">每个无障碍事件都遍历整棵控件树,占用聊天 App 主线程 → 点击时才解析(#23)</text><text x="1032" y="896" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 5 · 运行时视图与热点</text></svg>