<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="860" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">可观测性:错误码 + 本地诊断</text><text x="48" y="106" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">用户那边出了问题怎么知道?—— 不接第三方 SDK,数据只在用户手里</text><rect x="48" y="150" width="280" height="96" rx="14" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="2"/><text x="188" y="190" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle">28 处调用点</text><text x="188" y="222" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">原来 27 处异常被静默吞掉</text><line x1="328" y1="198" x2="404" y2="280" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><rect x="48" y="270" width="280" height="96" rx="14" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="2"/><text x="188" y="310" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle">崩溃处理器</text><text x="188" y="342" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">同步写 APP-901,再交还系统</text><line x1="328" y1="318" x2="404" y2="280" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><rect x="48" y="390" width="280" height="96" rx="14" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="2"/><text x="188" y="430" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle">ApplicationExitInfo</text><text x="188" y="462" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">下次启动读上次退出原因</text><line x1="328" y1="438" x2="404" y2="280" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><rect x="408" y="210" width="280" height="150" rx="16" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2.5"/><text x="548" y="252" font-family="Noto Sans Mono CJK SC" font-size="20" font-weight="700" fill="#2A9D8F" text-anchor="middle">DiagLog.record()</text><text x="548" y="288" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">只收错误码 + 数字 + 类名</text><text x="548" y="312" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">热路径:一次内存写入</text><text x="548" y="336" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">关闭开关 → 直接返回</text><line x1="688" y1="285" x2="762" y2="285" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><text x="725" y="270" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">每 5 秒</text><rect x="766" y="200" width="266" height="170" rx="16" fill="#FEF3E6" stroke="#F4A261" stroke-width="2"/><text x="899" y="240" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">files/diagnostics/</text><text x="899" y="276" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">events.log ×2(256KB 轮转)</text><text x="899" y="302" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">summary:计数 + 耗时分桶</text><text x="899" y="328" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">不进云备份</text><line x1="899" y1="370" x2="899" y2="440" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><rect x="700" y="444" width="332" height="150" rx="16" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><text x="866" y="484" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle">高级设置 → 导出</text><text x="866" y="520" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">先预览全文</text><text x="866" y="546" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">用户点「分享 / 复制」</text><text x="866" y="572" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">才离开这台手机</text><rect x="48" y="520" width="620" height="230" rx="14" fill="#0F172A" stroke="#0F172A" stroke-width="0"/><text x="72" y="556" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#E2E8F0" text-anchor="start">== 上次进程退出原因 ==</text><text x="72" y="584" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#E2E8F0" text-anchor="start">2026-11-15 01:41:49  CRASH</text><text x="72" y="612" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#E2E8F0" text-anchor="start">== 错误计数 ==</text><text x="72" y="640" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#E2E8F0" text-anchor="start">AI-108       12  网络不可用</text><text x="72" y="668" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#E2E8F0" text-anchor="start">BUB-501       1  启动前台服务失败</text><text x="72" y="696" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#E2E8F0" text-anchor="start">== 耗时 ==</text><text x="72" y="724" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#E2E8F0" text-anchor="start">点击到出结果  n=86  P50 ≤ 3s  P95 ≤ 5s</text><text x="48" y="784" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">导出示例(数字为示意)</text><rect x="700" y="620" width="332" height="150" rx="14" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="866" y="656" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="middle">隐私护栏</text><text x="866" y="690" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">不记聊天文本、Key、Base URL</text><text x="866" y="715" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">不记异常 message 和调用栈</text><text x="866" y="740" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">包名只在读屏 / OCR 记录里带</text><text x="1032" y="836" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 9 · 可观测性</text></svg>