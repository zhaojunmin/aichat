<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="900" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">正确性:真机上才看得见的问题</text><text x="48" y="106" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">真机测试发现的两个识别错误,示例为虚构对话</text><rect x="48" y="140" width="470" height="560" rx="22" fill="#DCEBF5" stroke="#9DB7CC" stroke-width="2"/><text x="68" y="174" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#4B6A85" text-anchor="start">群聊截图(浅色壁纸)</text><rect x="72" y="210" width="56" height="56" rx="10" fill="#B8C7D6" stroke="none" stroke-width="0"/><text x="146" y="228" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#5B6B7A" text-anchor="start">小周</text><rect x="144" y="240" width="340" height="106" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="164" y="280" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" fill="#1F2937" text-anchor="start">周末一起去爬山吗,顺便</text><text x="164" y="320" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" fill="#1F2937" text-anchor="start">带上相机拍点照片</text><rect x="142" y="210" width="44" height="26" rx="4" fill="none" stroke="#8E7CC3" stroke-width="2" stroke-dasharray="5,4"/><rect x="160" y="256" width="300" height="32" rx="4" fill="none" stroke="#E76F51" stroke-width="2" stroke-dasharray="5,4"/><rect x="160" y="296" width="210" height="32" rx="4" fill="none" stroke="#E76F51" stroke-width="2" stroke-dasharray="5,4"/><circle cx="152" cy="272" r="6" fill="#2A9D8F" stroke="none"/><circle cx="152" cy="312" r="6" fill="#2A9D8F" stroke="none"/><circle cx="248" cy="292" r="6" fill="#2A9D8F" stroke="none"/><circle cx="136" cy="222" r="6" fill="#F4A261" stroke="none"/><rect x="208" y="390" width="270" height="64" rx="10" fill="#A9E08F" stroke="none" stroke-width="0"/><text x="228" y="430" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" fill="#1F2937" text-anchor="start">好啊,几点出发?</text><rect x="424" y="390" width="0" height="0" rx="12" fill="none" stroke="none" stroke-width="1.5"/><rect x="68" y="500" width="430" height="176" rx="12" fill="#FFFFFFCC" stroke="#9DB7CC" stroke-width="1"/><text x="88" y="534" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">红框:OCR 把一个气泡识别成两块</text><text x="88" y="566" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">紫框:群聊发言人名字</text><text x="88" y="598" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">绿点:取色点(行左侧内边距、行间空隙)</text><text x="88" y="630" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">橙点:名字左侧(落在壁纸上)</text><text x="548" y="160" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#E76F51" text-anchor="start">问题 1:一个气泡被拆成几条</text><text x="548" y="196" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">合并相邻两块,需同时满足:</text><text x="548" y="226" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 间距 ≤ 一个行高</text><text x="548" y="256" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 左边缘偏差 ≤ 一个行高</text><text x="548" y="286" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">  (OCR 框每次抖动约 20px,半个行高会漏合)</text><text x="548" y="316" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 两行左侧和行间空隙是同一种气泡底色</text><text x="548" y="346" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 时间戳、系统提示先过滤再合并</text><text x="548" y="400" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#8E7CC3" text-anchor="start">问题 2:发言人名字被当成消息</text><text x="548" y="436" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">三项同时满足才剔除:</text><text x="548" y="466" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 单行短文本,正下方紧跟一个气泡</text><text x="548" y="496" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 字号更小(名字 39–42px,消息 48–52px)</text><text x="548" y="526" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">· 名字左侧是壁纸,气泡左侧是气泡底色</text><rect x="548" y="580" width="484" height="120" rx="12" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="566" y="612" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">踩坑:浅色壁纸 #E7F0F9 与白色气泡色差只有 45,</text><text x="566" y="640" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">而合并用的容差是 48(为抗锯齿留的)。</text><text x="566" y="668" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">比较两块纯色时改用更严的容差 12。</text><rect x="48" y="740" width="480" height="120" rx="12" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="68" y="774" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#E76F51" text-anchor="start">修复前:对方发了 3 条</text><text x="68" y="806" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">对方: 小周</text><text x="68" y="834" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">对方: 周末一起去爬山吗,顺便  /  对方: 带上相机拍点照片</text><rect x="552" y="740" width="480" height="120" rx="12" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="1.5"/><text x="572" y="774" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#2A9D8F" text-anchor="start">修复后:对方发了 1 条</text><text x="572" y="806" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">对方: 周末一起去爬山吗,顺便带上相机拍点照片</text><text x="1032" y="876" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 8 · 截图识别的两个修复</text></svg>