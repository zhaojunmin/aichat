<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="830" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">安全与隐私:数据边界</text><text x="48" y="106" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">哪些数据能出设备、在什么条件下出 —— 每条边界都有代码和测试守着</text><rect x="48" y="140" width="620" height="640" rx="34" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="358.0" y="184" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F3A5F" text-anchor="middle">用户的手机</text><rect x="80" y="210" width="250" height="92" rx="14" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="2"/><text x="205.0" y="248" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">聊天 App 屏幕</text><text x="205.0" y="280" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">微信 / QQ / Soul …</text><rect x="370" y="210" width="270" height="92" rx="14" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="2"/><text x="505.0" y="248" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">读屏(点击时才解析)</text><text x="505.0" y="280" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">原文不常驻内存</text><rect x="80" y="360" width="250" height="92" rx="14" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2"/><text x="205.0" y="398" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#2A9D8F" text-anchor="middle">本地模型推理</text><text x="205.0" y="430" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">MNN · Qwen2.5</text><rect x="370" y="360" width="270" height="92" rx="14" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2"/><text x="505.0" y="398" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#2A9D8F" text-anchor="middle">生成候选回复</text><text x="505.0" y="430" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">只给用户选,不自动发送</text><rect x="80" y="510" width="250" height="92" rx="14" fill="#FEF3E6" stroke="#B45309" stroke-width="2"/><text x="205.0" y="548" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">记忆库(Room)</text><text x="205.0" y="580" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">只学「我」说的话</text><rect x="370" y="510" width="270" height="92" rx="14" fill="#FEF3E6" stroke="#B45309" stroke-width="2"/><text x="505.0" y="548" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">API Key</text><text x="505.0" y="580" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">Keystore AES-GCM 加密</text><rect x="80" y="660" width="560" height="92" rx="14" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="2"/><text x="360.0" y="698" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">诊断信息(files/diagnostics)</text><text x="360.0" y="730" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">只有错误码、耗时、异常类名 · 无聊天内容、无 Key、无 message</text><line x1="330" y1="256" x2="366" y2="256" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arr)"/><line x1="505" y1="302" x2="505" y2="356" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arr)"/><line x1="334" y1="406" x2="366" y2="406" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="760" y="170" width="280" height="104" rx="16" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2"/><text x="900" y="212" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#2A9D8F" text-anchor="middle">云端 AI 服务</text><text x="900" y="244" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">仅云端模式:当前对话 · HTTPS</text><rect x="760" y="330" width="280" height="104" rx="16" fill="#FDECE7" stroke="#E76F51" stroke-width="2"/><text x="900" y="372" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#E76F51" text-anchor="middle">云端(本地模式时)</text><text x="900" y="404" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">0 字节:未就绪也不回退云端</text><rect x="760" y="490" width="280" height="104" rx="16" fill="#FDECE7" stroke="#E76F51" stroke-width="2"/><text x="900" y="532" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#E76F51" text-anchor="middle">系统云备份 / 换机</text><text x="900" y="564" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">数据库、prefs、文件全部排除</text><rect x="760" y="650" width="280" height="104" rx="16" fill="#FDECE7" stroke="#E76F51" stroke-width="2"/><text x="900" y="692" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#E76F51" text-anchor="middle">第三方崩溃 SDK</text><text x="900" y="724" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">不接入;诊断只由用户手动分享</text><path d="M640,240 C700,240 700,222 756,222" stroke="#2A9D8F" stroke-width="3" fill="none" marker-end="url(#arrT)"/><line x1="668" y1="382" x2="756" y2="382" stroke="#E76F51" stroke-width="3" marker-end="url(#arrR)" stroke-dasharray="8,6"/><circle cx="712" cy="382" r="19" fill="#FFFFFF" stroke="none"/><line x1="702.4" y1="372.4" x2="721.6" y2="391.6" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><line x1="702.4" y1="391.6" x2="721.6" y2="372.4" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><line x1="668" y1="542" x2="756" y2="542" stroke="#E76F51" stroke-width="3" marker-end="url(#arrR)" stroke-dasharray="8,6"/><circle cx="712" cy="542" r="19" fill="#FFFFFF" stroke="none"/><line x1="702.4" y1="532.4" x2="721.6" y2="551.6" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><line x1="702.4" y1="551.6" x2="721.6" y2="532.4" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><line x1="668" y1="702" x2="756" y2="702" stroke="#E76F51" stroke-width="3" marker-end="url(#arrR)" stroke-dasharray="8,6"/><circle cx="712" cy="702" r="19" fill="#FFFFFF" stroke="none"/><line x1="702.4" y1="692.4" x2="721.6" y2="711.6" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><line x1="702.4" y1="711.6" x2="721.6" y2="692.4" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><text x="1032" y="806" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">图 4 · 隐私数据边界</text></svg>