<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="760" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">图 9 在一台真人在用的手机上跑回路</text><text x="48" y="102" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">每条护栏背后都有一次「差点出事」或「真的踩到」</text><text x="48" y="150" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#E76F51" text-anchor="start">风险</text><text x="420" y="150" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#2A9D8F" text-anchor="start">护栏</text><rect x="40" y="168" width="1000" height="52" rx="6" fill="#F5F7FA" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="201" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">点到别的聊天</text><line x1="380" y1="194" x2="404" y2="194" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="201" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">每次点击前比对标题栏;不是参考聊天就中止,整屏截图不落盘</text><rect x="40" y="230" width="1000" height="52" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="263" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">关面板时误选候选</text><line x1="380" y1="256" x2="404" y2="256" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="263" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">关面板只按 Home,从不点面板</text><rect x="40" y="292" width="1000" height="52" rx="6" fill="#F5F7FA" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="325" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">云端会把聊天发出去</text><line x1="380" y1="318" x2="404" y2="318" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="325" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">测试只在「文件传输助手」里点;要不出设备就切本地模式</text><rect x="40" y="354" width="1000" height="52" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="387" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">关无障碍会改系统设置</text><line x1="380" y1="380" x2="404" y2="380" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="387" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">开始前记下原值,退出(包括中途失败)时恢复</text><rect x="40" y="416" width="1000" height="52" rx="6" fill="#F5F7FA" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="449" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">堆 dump 里有聊天和 API Key</text><line x1="380" y1="442" x2="404" y2="442" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="449" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">报告写完默认删除,KEEP=1 才保留</text><rect x="40" y="478" width="1000" height="52" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="511" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">monkey 会点中「清空记忆」</text><line x1="380" y1="504" x2="404" y2="504" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="511" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">不做随机点击压力测试</text><rect x="40" y="540" width="1000" height="52" rx="6" fill="#F5F7FA" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="573" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">force-stop 会关掉无障碍(这台 ROM)</text><line x1="380" y1="566" x2="404" y2="566" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="573" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">崩溃场景改用 am crash</text><rect x="40" y="602" width="1000" height="52" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="635" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">UiAutomation 会压制被测的无障碍服务</text><line x1="380" y1="628" x2="404" y2="628" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="635" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">首次使用前设 FLAG_DONT_SUPPRESS_ACCESSIBILITY_SERVICES</text><rect x="40" y="664" width="1000" height="52" rx="6" fill="#F5F7FA" stroke="#FFFFFF" stroke-width="1.5"/><text x="56" y="697" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">release 包的 logcat 被屏蔽</text><line x1="380" y1="690" x2="404" y2="690" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="697" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">崩溃 / ANR 改从 dumpsys dropbox 读,要求带固定表头</text><text x="1032" y="736" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">perf-loop.sh · leak-loop.sh · run-reliability.sh · quality/reliability/Phone.kt</text></svg>