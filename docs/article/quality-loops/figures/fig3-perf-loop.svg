<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="780" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">图 3 性能回路:把手动点测变成可重复的闭环</text><text x="48" y="102" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">手机是真人在用的:每次点击前先确认屏幕上是那个测试聊天</text><rect x="48" y="200" width="212" height="130" rx="12" fill="#E8F0FA" stroke="#E8F0FA" stroke-width="1.5"/><text x="154.0" y="234" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">① 记参考</text><text x="154.0" y="268" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">打开测试聊天</text><text x="154.0" y="292" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">只存标题栏一条</text><line x1="264" y1="265.0" x2="301" y2="265.0" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><rect x="305" y="200" width="212" height="130" rx="12" fill="#E8F0FA" stroke="#E8F0FA" stroke-width="1.5"/><text x="411.0" y="234" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">② 比对标题栏</text><text x="411.0" y="268" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">同聊天 0%</text><text x="411.0" y="292" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">换聊天 ≈7%</text><text x="411.0" y="316" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">阈值 0.2%</text><line x1="521" y1="265.0" x2="558" y2="265.0" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><rect x="562" y="200" width="212" height="130" rx="12" fill="#E8F0FA" stroke="#E8F0FA" stroke-width="1.5"/><text x="668.0" y="234" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">③ 点悬浮球</text><text x="668.0" y="268" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">等出结果</text><text x="668.0" y="292" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">(默认 15 s)</text><line x1="778" y1="265.0" x2="815" y2="265.0" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><rect x="819" y="200" width="212" height="130" rx="12" fill="#E8F0FA" stroke="#E8F0FA" stroke-width="1.5"/><text x="925.0" y="234" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">④ 按 Home</text><text x="925.0" y="268" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">关面板</text><text x="925.0" y="292" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">从不点面板</text><path d="M925.0,334 L925.0,364 L411.0,364 L411.0,338" stroke="#2A9D8F" stroke-width="2.5" fill="none" marker-end="url(#arrT)"/><text x="668.0" y="388" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#2A9D8F" text-anchor="middle">重复 N 次点击 × M 轮</text><line x1="411.0" y1="196" x2="411.0" y2="170" stroke="#E76F51" stroke-width="2"/><rect x="321.0" y="140" width="195.20000000000002" height="28" rx="14" fill="#E76F51" stroke="#E76F51" stroke-width="1"/><text x="418.6" y="159.04" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">不是参考聊天 → 整轮中止</text><text x="48" y="450" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">同时记录</text><rect x="48" y="470" width="560" height="48" rx="8" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="1.5"/><text x="64" y="501" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="start">atrace</text><text x="270" y="501" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">App 打点(a11y.* / bubble.* / embed.forward)</text><rect x="48" y="532" width="560" height="48" rx="8" fill="#FEF3E6" stroke="#FEF3E6" stroke-width="1.5"/><text x="64" y="563" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">Perfetto(PROFILE=1)</text><text x="270" y="563" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">调用栈采样 1 kHz,本进程用户态</text><path d="M612,494 L660,494 L660,525 L700,525" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M612,556 L660,556 L660,525" stroke="#6B7280" stroke-width="2" fill="none"/><rect x="704" y="480" width="328" height="90" rx="10" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="868.0" y="518.95" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">按 BOOTTIME 时钟对齐</text><text x="868.0" y="542.95" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">把采样归到各个阶段</text><rect x="48" y="620" width="312" height="104" rx="12" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="1.5"/><text x="204" y="652" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="middle">trace_summary.py</text><text x="204" y="682" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">每阶段 P50/P95/max</text><text x="204" y="705" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">对照预算 → 退出码</text><rect x="384" y="620" width="312" height="104" rx="12" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="1.5"/><text x="540" y="652" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="middle">perf-history.csv</text><text x="540" y="682" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">一行 = 一轮 × 一阶段</text><text x="540" y="705" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">带提交号和安装时间</text><rect x="720" y="620" width="312" height="104" rx="12" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="1.5"/><text x="876" y="652" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="middle">perfetto_analyze.py</text><text x="876" y="682" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">热点库 / 函数</text><text x="876" y="705" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">--html 按阶段火焰图</text><text x="1032" y="446" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#B45309" text-anchor="end">这台荣耀上 traced_probes 被厂商停用:Perfetto 采不到 App 打点,所以用 atrace 补</text><text x="1032" y="756" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">quality/scripts/perf-loop.sh · perf_guard.py · trace_summary.py · perfetto_analyze.py</text></svg>