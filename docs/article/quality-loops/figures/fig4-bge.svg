oke="#E5E7EB" stroke-width="1.5"/><text x="929.6" y="435" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#1F2937" text-anchor="start">P50 160</text><text x="1009.28" y="461" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#1F2937" text-anchor="start">P95 243</text><text x="580" y="530" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">线程不是越多越好:6 线程 P95 反而最差</text><text x="580" y="555" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">采用 4 线程 + Power_High:P95 约 190 → 137 ms</text><text x="580" y="580" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">参数从 JNI 传入,不再写死在 so 里</text><text x="1032" y="656" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">docs/performance-testing.md;4 线程两组各跑两次取均值,2/6 线程各一次;每组 6–8 次点击</text></svg>