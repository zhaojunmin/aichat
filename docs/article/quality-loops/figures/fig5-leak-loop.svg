<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker></defs><rect width="1080" height="700" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start">图 5 内存泄漏回路:反复折腾生命周期,比较堆里谁在涨</text><text x="48" y="102" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">不靠肉眼看一次 dump,而是比较多次 dump 之间的趋势</text><rect x="48" y="150" width="470" height="280" rx="14" fill="#E8F0FA" stroke="#E8F0FA" stroke-width="1.5"/><text x="68" y="186" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start">一轮(覆盖会反复创建 / 销毁的对象)</text><rect x="68" y="210" width="430" height="58" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="84" y="236" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">① 首页 → Home</text><text x="84" y="258" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">MainActivity / Compose / ViewModel</text><rect x="68" y="280" width="430" height="58" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="84" y="306" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">② 无障碍 关 → 开</text><text x="84" y="328" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">BubbleController / 悬浮窗 / 协程</text><rect x="68" y="350" width="430" height="58" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="84" y="376" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">③ 点悬浮球 → Home</text><text x="84" y="398" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">面板 / 读屏·OCR / 生成(TAP=1)</text><text x="560" y="160" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start">轮次与堆 dump</text><rect x="560" y="190" width="150" height="32" rx="8" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="1.5"/><text x="635" y="212" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">预热 ×2</text><rect x="560" y="230" width="150" height="32" rx="8" fill="#F4A261" stroke="#F4A261" stroke-width="1.5"/><text x="635" y="252" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">dump 0</text><rect x="560" y="270" width="150" height="32" rx="8" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="1.5"/><text x="635" y="292" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">×10 轮</text><rect x="560" y="310" width="150" height="32" rx="8" fill="#F4A261" stroke="#F4A261" stroke-width="1.5"/><text x="635" y="332" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">dump 1</text><rect x="560" y="350" width="150" height="32" rx="8" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="1.5"/><text x="635" y="372" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">×10 轮</text><rect x="560" y="390" width="150" height="32" rx="8" fill="#F4A261" stroke="#F4A261" stroke-width="1.5"/><text x="635" y="412" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">dump 2</text><text x="730" y="212" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">首次使用的缓存不算泄漏,先预热</text><text x="730" y="238" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Perfetto android.java_hprof</text><text x="730" y="264" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">正式包是 profileable 的,</text><text x="730" y="290" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">不用 debug 包,不往 App 里加代码</text><text x="730" y="316" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">一次 dump 约 20 MB</text><line x1="518" y1="290" x2="552" y2="290" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="48" y="470" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">heap_leak.py 怎么判断</text><rect x="48" y="490" width="232" height="116" rx="12" fill="#FEF3E6" stroke="#FEF3E6" stroke-width="1.5"/><text x="164" y="522" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">只看可达对象</text><text x="164" y="554" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">App 堆里从 GC root</text><text x="164" y="577" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">还能走到的;垃圾不算</text><rect x="296" y="490" width="232" height="116" rx="12" fill="#FEF3E6" stroke="#FEF3E6" stroke-width="1.5"/><text x="412" y="522" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">疑似泄漏</text><text x="412" y="554" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">每个区间都在涨</text><text x="412" y="577" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">且平均每轮 ≥ 1 个</text><rect x="544" y="490" width="232" height="116" rx="12" fill="#FEF3E6" stroke="#FEF3E6" stroke-width="1.5"/><text x="660" y="522" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">生命周期对象</text><text x="660" y="554" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">同一时刻最多 1 个</text><text x="660" y="577" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">多了就打印引用链</text><rect x="792" y="490" width="232" height="116" rx="12" fill="#FEF3E6" stroke="#FEF3E6" stroke-width="1.5"/><text x="908" y="522" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">按持有者归因</text><text x="908" y="554" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">按引用链末尾几跳分组</text><text x="908" y="577" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">区分 App 字段与库缓存</text><text x="1032" y="646" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#E76F51" text-anchor="end">堆 dump 是 App 的全部 Java 内存(含聊天内容和 API Key):报告写完默认删除,KEEP=1 才保留</text><text x="1032" y="676" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">quality/scripts/leak-loop.sh · heap_leak.py · quality/perfetto/java-heap.pbtxt</text></svg>