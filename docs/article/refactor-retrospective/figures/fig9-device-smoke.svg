xml:space="preserve">bubble.tapToResult</text><rect x="524.6" y="174" width="111.0" height="30" rx="15" fill="#8E7CC3" stroke="#8E7CC3" stroke-width="1"/><text x="580.1" y="194.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">bubble.ocr</text><rect x="649.6" y="174" width="154.5" height="30" rx="15" fill="#6B7280" stroke="#6B7280" stroke-width="1"/><text x="726.85" y="194.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">bubble.generate</text><circle cx="1000" cy="190" r="17" fill="#FFFFFF" stroke="none"/><circle cx="1000" cy="190" r="14" fill="#2A9D8F" stroke="none"/><path d="M993.0,190 L998.6,195.6 L1007.7,184.4" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="260" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#8E7CC3" text-anchor="start" xml:space="preserve">走截图 OCR,没有 a11y.parse;截图时悬浮球已隐藏</text><rect x="48" y="320" width="984" height="150" rx="14" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="72" y="360" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">Soul · 个人主页</text><text x="72" y="390" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">控件树 App;不进任何聊天</text><rect x="330" y="344" width="180.6" height="30" rx="15" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="420.3" y="364.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">bubble.tapToResult</text><rect x="524.6" y="344" width="111.0" height="30" rx="15" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="1"/><text x="580.1" y="364.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">a11y.parse</text><rect x="649.6" y="344" width="154.5" height="30" rx="15" fill="#6B7280" stroke="#6B7280" stroke-width="1"/><text x="726.85" y="364.4" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">bubble.generate</text><circle cx="1000" cy="360" r="17" fill="#FFFFFF" stroke="none"/><circle cx="1000" cy="360" r="14" fill="#2A9D8F" stroke="none"/><path d="M993.0,360 L998.6,365.6 L1007.7,354.4" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="430" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="start" xml:space="preserve">走控件树,没有 bubble.ocr;读到页面文本并出候选</text><text x="48" y="516" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">冒烟时踩到的坑</text><circle cx="66" cy="554" r="13" fill="#FFFFFF" stroke="none"/><line x1="60.0" y1="548.0" x2="72.0" y2="560.0" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><line x1="60.0" y1="560.0" x2="72.0" y2="548.0" stroke="#E76F51" stroke-width="5" stroke-linecap="round"/><text x="92" y="561" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#E76F51" text-anchor="start" xml:space="preserve">adb.exe shell 导出 trace</text><text x="400" y="561" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">Windows 侧把 \n 改成 \r\n,压缩数据直接损坏 → 改用 adb exec-out</text><circle cx="66" cy="604" r="13" fill="#FFFFFF" stroke="none"/><line x1="60.0" y1="598.0" x2="72.0" y2="610.0" stroke="#B45309" stroke-width="5" stroke-linecap="round"/><line x1="60.0" y1="610.0" x2="72.0" y2="598.0" stroke="#B45309" stroke-width="5" stroke-linecap="round"/><text x="92" y="611" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B45309" text-anchor="start" xml:space="preserve">统计全是 0</text><text x="400" y="611" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">trace 行格式是「: S|pid|名称|cookie」,正则多写了一个 |</text><circle cx="66" cy="654" r="10" fill="#6B7280" stroke="none"/><text x="92" y="661" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#6B7280" text-anchor="start" xml:space="preserve">QQ 被「健康使用手机」挡住</text><text x="400" y="661" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">不点「继续使用」绕过,换 Soul 个人主页验证控件树路径</text><text x="1032" y="696" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end" xml:space="preserve">图 9 · 真机冒烟</text></svg>