K SC" font-size="16" font-weight="700" fill="#1F3A5F" text-anchor="middle" xml:space="preserve">按 #45 → #46 → #47 合并</text><rect x="48" y="530" width="984" height="80" rx="12" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="72" y="562" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">反例:#46 以 #45 的分支为 base —— #45 合并、分支删除后,#46 会被关闭或失去目标(以前踩过)。</text><text x="72" y="592" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#2A9D8F" text-anchor="start" xml:space="preserve">base=main:前一个合并后,后一个 PR 的 diff 自动收缩到只剩自己的提交。</text><text x="1032" y="636" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end" xml:space="preserve">图 8 · 三个 PR 的分支策略</text></svg>