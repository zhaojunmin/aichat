<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="870" viewBox="0 0 1080 870"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E7CC3"/></marker></defs><rect width="1080" height="870" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">Lint 清零,并且不留后门</text><text x="48" y="112" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">19 条存量问题(1 error + 18 warning)全部修掉,baseline 文件删除</text><text x="48" y="166" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">唯一的 error:NewApi —— 版本判断藏在变量里,Lint 跟不过去</text><rect x="48" y="186" width="474" height="250" rx="14" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="72" y="222" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#E76F51" text-anchor="start" xml:space="preserve">改前</text><text x="72" y="260" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">val useOcr = pkg in ocrSet &amp;&amp;</text><text x="72" y="284" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">    SDK_INT &gt;= R</text><text x="72" y="308" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">if (!useOcr) { …; return conv }</text><text x="72" y="332" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">…</text><text x="72" y="356" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">reader.captureScreenshot(pkg)</text><text x="72" y="380" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">      ^ NewApi: 需要 API 30</text><rect x="558" y="186" width="474" height="250" rx="14" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="1.5"/><text x="582" y="222" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#2A9D8F" text-anchor="start" xml:space="preserve">改后</text><text x="582" y="260" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">return if (pkg in ocrSet &amp;&amp;</text><text x="582" y="284" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">    SDK_INT &gt;= R) {</text><text x="582" y="308" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">    readViaOcr(pkg)</text><text x="582" y="332" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">} else readFromNodeTree(pkg)</text><text x="582" y="356" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"></text><text x="582" y="380" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">@RequiresApi(R) fun readViaOcr(…)</text><line x1="524" y1="311" x2="554" y2="311" stroke="#6B7280" stroke-width="3" marker-end="url(#arr)"/><text x="48" y="470" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">运行时其实不会出错,但这说明代码不够直白——Lint 看不懂的,人也容易看漏。</text><text x="48" y="520" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">其余 18 条</text><rect x="48" y="552" width="101.19999999999999" height="26" rx="13" fill="#E76F51" stroke="#E76F51" stroke-width="1"/><text x="98.6" y="569.68" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">InlinedApi</text><text x="270" y="571" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">API 34 的前台服务类型从 API 29 就开始传 → 改为 34 起才传</text><rect x="48" y="590" width="174.27999999999997" height="26" rx="13" fill="#B45309" stroke="#B45309" stroke-width="1"/><text x="135.14" y="607.68" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">PluralsCandidate ×4</text><text x="270" y="609" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">英文「1 messages」→ 改成「Messages: 1」这种标签写法</text><rect x="48" y="628" width="133.68" height="26" rx="13" fill="#B45309" stroke="#B45309" stroke-width="1"/><text x="114.84" y="645.68" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">SetTextI18n ×2</text><text x="270" y="647" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">悬浮球 "AI"、候选序号 → 不翻译的字符串资源</text><rect x="48" y="666" width="93.08" height="26" rx="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="94.53999999999999" y="683.68" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">UseKtx ×3</text><text x="270" y="685" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">SharedPreferences.edit { } · String.toUri()</text><rect x="48" y="704" width="174.27999999999997" height="26" rx="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="135.14" y="721.68" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Monochrome / Unused</text><text x="270" y="723" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">补单色主题图标(眼睛镂空);删掉无用的圆形图标</text><rect x="48" y="742" width="48" height="26" rx="13" fill="#6B7280" stroke="#6B7280" stroke-width="1"/><text x="72.0" y="759.68" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">其余</text><text x="270" y="761" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">v26 目录合并、tools:targetApi、依赖进 version catalog、ChromeOS 检查注明理由后关闭</text><text x="48" y="800" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">之后:lint { warningsAsErrors = true },不再设 baseline——warning 会悄悄堆积,这 18 条就是这么来的。</text><text x="1032" y="846" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end" xml:space="preserve">图 5 · Lint 清零</text></svg>