<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E7CC3"/></marker></defs><rect width="1080" height="830" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">起点:Bubble 到底指什么?</text><text x="48" y="112" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">同一个词在代码里指两样东西,读的人只能靠上下文猜</text><rect x="420" y="150" width="240" height="84" rx="42" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/><text x="540" y="205" font-family="Noto Sans Mono CJK SC" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Bubble</text><path d="M480,234 C420,280 300,270 270,310" stroke="#2A9D8F" stroke-width="3" fill="none" marker-end="url(#arrT)"/><path d="M600,234 C660,280 780,270 810,310" stroke="#E76F51" stroke-width="3" fill="none" marker-end="url(#arrR)"/><rect x="60" y="316" width="440" height="190" rx="14" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="1.5"/><text x="84" y="356" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#2A9D8F" text-anchor="start" xml:space="preserve">意思 A:悬浮球</text><text x="84" y="396" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">bubble/ 包</text><text x="84" y="422" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">FloatingBubbleService</text><text x="84" y="448" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">BubblePanel · BubbleStyle</text><text x="84" y="474" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">Tracing.BUBBLE_*</text><rect x="580" y="316" width="440" height="190" rx="14" fill="#FDECE7" stroke="#E76F51" stroke-width="1.5"/><text x="604" y="356" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#E76F51" text-anchor="start" xml:space="preserve">意思 B:聊天消息气泡</text><text x="604" y="396" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">BubbleLocator · BubbleBox</text><text x="604" y="422" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">BubbleLineMerger</text><text x="604" y="448" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">locateBubbles()</text><text x="604" y="474" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">sameBubble · gapIsBubble</text><rect x="60" y="536" width="960" height="120" rx="14" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="84" y="572" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#6B7280" text-anchor="start" xml:space="preserve">最容易读错的地方(FloatingBubbleService)</text><text x="84" y="606" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">// Hide our own bubble so it isn't part of the captured image</text><text x="84" y="632" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">boxes = reader.locateBubbles(pkg)   // ← 找自己的悬浮球?</text><text x="48" y="704" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">约定:代码标识符里 Bubble 只指悬浮球;聊天消息一律用 Message</text><text x="48" y="738" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">BubbleLocator → MessageBoundsLocator · BubbleLineMerger → MessageLineMerger · …</text><text x="48" y="772" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">描述外观的注释(bubble background / padding)保留——那是屏幕上真实的视觉气泡。</text><text x="1032" y="806" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end" xml:space="preserve">图 2 · 一词两义</text></svg>