" stroke="#D7DEE8" stroke-width="1.5"/><text x="260" y="511" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">Android Lint</text><text x="260" y="533" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">无 baseline · warningsAsErrors</text><text x="580" y="511" font-family="Noto Sans Mono CJK SC" font-size="14" font-weight="400" fill="#1F3A5F" text-anchor="end" xml:space="preserve">lint { }</text><rect x="246" y="552" width="348" height="54" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="260" y="575" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">Compose 检查</text><text x="260" y="597" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">compose-lints(Slack)</text><text x="580" y="575" font-family="Noto Sans Mono CJK SC" font-size="14" font-weight="400" fill="#1F3A5F" text-anchor="end" xml:space="preserve">lintChecks</text><rect x="246" y="616" width="348" height="54" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><text x="260" y="639" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">构建</text><text x="260" y="661" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">assembleDebug · 基准编译</text><text x="580" y="639" font-family="Noto Sans Mono CJK SC" font-size="14" font-weight="400" fill="#1F3A5F" text-anchor="end" xml:space="preserve"></text><path d="M168,330 C200,330 200,250 228,250" stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M168,350 C200,350 200,520 228,520" stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="700" y="300" width="150" height="80" rx="14" fi