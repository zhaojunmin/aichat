#1F2937" text-anchor="middle" xml:space="preserve">AccessibilityScreen</text><text x="193" y="324" font-family="Noto Sans Mono CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">ChatWindowReader + ReplyFiller</text><rect x="400" y="170" width="300" height="200" rx="14" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2.5"/><text x="550" y="206" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="middle" xml:space="preserve">AccessibilityBridge</text><text x="420" y="248" font-family="Noto Sans Mono CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">screen:</text><text x="420" y="274" font-family="Noto Sans Mono CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">  StateFlow&lt;ScreenAccess?&gt;</text><text x="420" y="300" font-family="Noto Sans Mono CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">foreground:</text><text x="420" y="326" font-family="Noto Sans Mono CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">  StateFlow&lt;ForegroundApp?&gt;</text><line x1="338" y1="230" x2="396" y2="230" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arrN)"/><text x="367" y="220" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F3A5F" text-anchor="middle" xml:space="preserve">连接</text><line x1="338" y1="330" x2="396" y2="330" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arrN)" stroke-dasharray="6 5"/><text x="367" y="354" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F3A5F" text-anchor="middle" xml:space="preserve">断开</text><rect x="762" y="170" width="270" height="200" rx="14" fill="#E8F0FA" stroke="#1F3A5F" stroke-width="1.5"/><text x="897" y="206" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="middle" xml:space="preserve">FloatingBubble</text><text x="897" y="230" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="middle" xml:space="preserve">Service</text><text x="897" y="274" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">窗口 · 拖拽 · 面板</text><text x="897" y="300" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">生成 · 剪贴板</text><text x="897" y="346" font-family="Noto Sans Mono CJK SC" font-size="15" font-weight="700" fill="#8E7CC3" text-anchor="middle" xml:space="preserve">实现 CaptureOverlay</text><line x1="760" y1="260" x2="704" y2="260" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrT)"/><text x="732" y="250" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#2A9D8F" text-anchor="middle" xml:space="preserve">订阅</text><rect x="400" y="420" width="300" height="120" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="8 6"/><text x="550" y="452" font-family="Noto Sans Mono CJK SC" font-size="16" font-weight="700" fill="#2A9D8F" text-anchor="middle" xml:space="preserve">«interface» ScreenAccess</text><text x="424" y="484" font-family="Noto Sans Mono CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">readConversation · fill</text><text x="424" y="506" font-family="Noto Sans Mono CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">locateMessageBounds</text><text x="424" y="528" font-family="Noto Sans Mono CJK SC" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">captureScreenshot · imeBounds</text><line x1="193" y1="372" x2="398" y2="470" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrN)" stroke-dasharray="4 4"/><text x="250" y="440" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#1F3A5F" text-anchor="start" xml:space="preserve">实现</text><rect x="762" y="420" width="270" height="140" rx="14" fill="#F1EEF9" stroke="#8E7CC3" stroke-width="1.5"/><text x="897" y="456" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#8E7CC3" text-anchor="middle" xml:space="preserve">ChatCapture</text><text x="897" y="488" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve">控件树 / OCR 分流</text><text x="897" y="512" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve">截图 · 裁键盘 · 引导 OCR</text><line x1="897" y1="372" x2="897" y2="416" stroke="#8E7CC3" stroke-width="2.5" marker-end="url(#arrP)"/><line x1="760" y1="480" x2="704" y2="480" stroke="#8E7CC3" stroke-width="2.5" marker-end="url(#arrP)"/><text x="732" y="470" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#8E7CC3" text-anchor="middle" xml:space="preserve">只依赖</text><rect x="762" y="600" width="130" height="60" rx="10" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="827" y="636" font-family="Noto Sans Mono CJK SC" font-size="15" font-weight="700" fill="#6B7280" text-anchor="middle" xml:space="preserve">OcrReader</text><rect x="902" y="600" width="130" height="60" rx="10" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="967" y="636" font-family="Noto Sans Mono CJK SC" font-size="15" font-weight="700" fill="#6B7280" text-anchor="middle" xml:space="preserve">DebugCapture</text><line x1="840" y1="562" x2="830" y2="596" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><line x1="950" y1="562" x2="960" y2="596" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><rect x="48" y="590" width="650" height="140" rx="14" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="72" y="624" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">Konsist 把结构钉住(违反就 CI 失败)</text><text x="72" y="656" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">· bubble 读屏只能用 AccessibilityBridge,读取一律经 capture</text><text x="72" y="682" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">· capture 只能经 ScreenAccess 访问读屏,碰不到具体实现</text><text x="72" y="708" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">· 根包只放 ChatAssistantApp —— 不让下一个 AppBus 长出来</text><text x="1032" y="736" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end" xml:space="preserve">图 7 · 重构后</text></svg>