<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="982" viewBox="0 0 1080 982"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E7CC3"/></marker></defs><rect width="1080" height="982" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">把风格指南变成 CI 门禁</text><text x="48" y="112" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">工具跑通 ≠ 规范落地:每个坑都是「以为过了,其实没过」</text><rect x="48" y="140" width="984" height="150" rx="14" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="140" width="10" height="150" rx="4" fill="#E76F51" stroke="#E76F51" stroke-width="0"/><circle cx="96" cy="180" r="18" fill="#E76F51" stroke="none"/><text x="96" y="187.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">1</text><text x="128" y="188" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">守护进程缓存了 .editorconfig</text><text x="128" y="228" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">现象:改了「关闭尾随逗号规则」,格式化却仍按旧配置删掉了一批逗号</text><text x="128" y="264" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#E76F51" text-anchor="start" xml:space="preserve">处理:改规则后先 ./gradlew --stop;干脆改为强制尾随逗号,误删的自动补回</text><rect x="48" y="308" width="984" height="150" rx="14" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="308" width="10" height="150" rx="4" fill="#B45309" stroke="#B45309" stroke-width="0"/><circle cx="96" cy="348" r="18" fill="#B45309" stroke="none"/><text x="96" y="355.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">2</text><text x="128" y="356" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">Spotless 每个文件只报第一条</text><text x="128" y="396" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">现象:报告 16 处违规,实际超 100 列的行有 138 行</text><text x="128" y="432" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#B45309" text-anchor="start" xml:space="preserve">处理:自己用脚本按字符数扫全仓库,心里先有真实规模</text><rect x="48" y="476" width="984" height="150" rx="14" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="476" width="10" height="150" rx="4" fill="#8E7CC3" stroke="#8E7CC3" stroke-width="0"/><circle cx="96" cy="516" r="18" fill="#8E7CC3" stroke="none"/><text x="96" y="523.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">3</text><text x="128" y="524" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">匹配范围扫进了 build/</text><text x="128" y="564" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">现象:quality/**/src/** 命中了生成源码,和打包任务产生隐式依赖,构建报错</text><text x="128" y="600" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#8E7CC3" text-anchor="start" xml:space="preserve">处理:target 收窄到 quality/*/src,并 targetExclude("**/build/**")</text><rect x="48" y="644" width="984" height="150" rx="14" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/><rect x="48" y="644" width="10" height="150" rx="4" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/><circle cx="96" cy="684" r="18" fill="#1F3A5F" stroke="none"/><text x="96" y="691.2" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">4</text><text x="128" y="692" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" xml:space="preserve">ktlint 管不到的规则</text><text x="128" y="732" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">现象:超长的纯注释行、反引号测试名、approxMB 这类缩写都没报</text><text x="128" y="768" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#1F3A5F" text-anchor="start" xml:space="preserve">处理:对照指南逐条补扫:注释折行、6 个测试名改驼峰、approxMB → approxMb</text><rect x="48" y="812" width="984" height="110" rx="14" fill="#F5F7FA" stroke="#D7DEE8" stroke-width="1.5"/><text x="72" y="850" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">提交怎么拆</text><rect x="72" y="868" width="116.96" height="28" rx="14" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="130.48" y="887.04" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">① 配置 + CI</text><rect x="228.95999999999998" y="868" width="233.12" height="28" rx="14" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="1"/><text x="345.52" y="887.04" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">② 全仓库格式化(无逻辑改动)</text><rect x="502.08" y="868" width="327.84" height="28" rx="14" fill="#8E7CC3" stroke="#8E7CC3" stroke-width="1"/><text x="666.0" y="887.04" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">③ 把 ② 记入 .git-blame-ignore-revs</text><line x1="194.95999999999998" y1="882" x2="222.95999999999998" y2="882" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><line x1="468.08" y1="882" x2="496.08" y2="882" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/><text x="1032" y="958" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end" xml:space="preserve">图 4 · 规范检查的四个坑</text></svg>