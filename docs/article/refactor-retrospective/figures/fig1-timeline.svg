<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1078" viewBox="0 0 1080 1078"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E76F51"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E7CC3"/></marker></defs><rect width="1080" height="1078" fill="#FFFFFF"/><text x="48" y="64" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">从一个命名问题开始的一天</text><line x1="96" y1="180" x2="96" y2="998" stroke="#D7DEE8" stroke-width="4"/><text x="48" y="112" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">一天 8 个 PR:每个都可单独回滚,分支一律以 main 为 base</text><rect x="48" y="150" width="66" height="34" rx="17" fill="#8E7CC3" stroke="#8E7CC3" stroke-width="1"/><text x="81.0" y="173.12" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">命名</text><circle cx="96" cy="209" r="8" fill="#8E7CC3" stroke="none"/><text x="124" y="216" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#8E7CC3" text-anchor="start" xml:space="preserve">#40</text><text x="214" y="216" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">Bubble 一词两义 → 统一:Bubble 只指悬浮球,消息用 Message</text><rect x="48" y="270" width="100" height="34" rx="17" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="98.0" y="293.12" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">代码规范</text><circle cx="96" cy="329" r="8" fill="#1F3A5F" stroke="none"/><text x="124" y="336" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start" xml:space="preserve">#41</text><text x="214" y="336" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">Android Kotlin 风格指南 → ktlint + Spotless,CI 加 style 任务</text><text x="214" y="378" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">全仓库修正 85 个文件;超 100 列的行 138 → 0</text><rect x="48" y="432" width="100" height="34" rx="17" fill="#B45309" stroke="#B45309" stroke-width="1"/><text x="98.0" y="455.12" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">静态检查</text><circle cx="96" cy="491" r="8" fill="#B45309" stroke="none"/><text x="124" y="498" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#B45309" text-anchor="start" xml:space="preserve">#42</text><text x="214" y="498" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">存量 Lint 19 条清零;删掉 baseline,warningsAsErrors</text><rect x="48" y="552" width="100" height="34" rx="17" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="1"/><text x="98.0" y="575.12" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">架构规则</text><circle cx="96" cy="611" r="8" fill="#2A9D8F" stroke="none"/><text x="124" y="618" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="start" xml:space="preserve">#43</text><text x="214" y="618" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">Konsist:包依赖白名单、命名规则写成单测</text><circle cx="96" cy="653" r="8" fill="#2A9D8F" stroke="none"/><text x="124" y="660" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="start" xml:space="preserve">#44</text><text x="214" y="660" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">compose-lints:Compose 专项检查</text><rect x="48" y="714" width="100" height="34" rx="17" fill="#E76F51" stroke="#E76F51" stroke-width="1"/><text x="98.0" y="737.12" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">架构重构</text><circle cx="96" cy="773" r="8" fill="#E76F51" stroke="none"/><text x="124" y="780" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="start" xml:space="preserve">#45</text><text x="214" y="780" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">调试数据移到 DebugCapture;删死代码</text><circle cx="96" cy="815" r="8" fill="#E76F51" stroke="none"/><text x="124" y="822" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="start" xml:space="preserve">#46</text><text x="214" y="822" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">ScreenAccess 接口 + AccessibilityBridge,删掉 AppBus</text><circle cx="96" cy="857" r="8" fill="#E76F51" stroke="none"/><text x="124" y="864" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#E76F51" text-anchor="start" xml:space="preserve">#47</text><text x="214" y="864" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">读取流程抽成 ChatCapture,补 5 个单测</text><rect x="48" y="918" width="66" height="34" rx="17" fill="#6B7280" stroke="#6B7280" stroke-width="1"/><text x="81.0" y="941.12" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">验证</text><circle cx="96" cy="977" r="8" fill="#6B7280" stroke="none"/><text x="124" y="984" font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" fill="#6B7280" text-anchor="start" xml:space="preserve">真机</text><text x="214" y="984" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve">release 包冒烟:OCR 路径 + 控件树路径,0 崩溃</text><text x="1032" y="1054" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end" xml:space="preserve">图 1 · 当天时间线</text></svg>